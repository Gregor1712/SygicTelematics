apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: sygic-telematics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-api
  template:
    metadata:
      labels:
        app: gateway-api
    spec:
      containers:
        - name: gateway-api
          image: sygic-registry:5000/gateway-api:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
            - name: ServiceUrls__Identity
              value: "http://identity-api:8080"
            - name: ServiceUrls__Vehicle
              value: "http://vehicle-api:5103"
            - name: GrpcUrls__Vehicle
              value: "http://vehicle-api:6103"
            - name: GrpcUrls__Location
              value: "http://location-api:6104"
            - name: GrpcUrls__Battery
              value: "http://battery-api:6105"
            - name: GrpcUrls__Trip
              value: "http://trip-api:6106"
            - name: GrpcUrls__Telemetry
              value: "http://telemetry-api:6107"
            - name: GrpcUrls__Alert
              value: "http://alert-api:6108"
            - name: TokenKey
              valueFrom:
                secretKeyRef:
                  name: sygic-db-secret
                  key: TokenKey
          envFrom:
            - configMapRef:
                name: sygic-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: sygic-telematics
spec:
  selector:
    app: gateway-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
