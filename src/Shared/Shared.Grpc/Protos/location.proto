syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Location";

package location;

service LocationGrpc {
  rpc GetByVehicle (VehicleIdRequest) returns (LocationListReply);
  rpc Create (CreateLocationRequest) returns (LocationReply);
}

message VehicleIdRequest {
  string vehicle_id = 1;
}

message CreateLocationRequest {
  string vehicle_id = 1;
  double latitude = 2;
  double longitude = 3;
  optional double speed = 4;
}

message LocationReply {
  string id = 1;
  string vehicle_id = 2;
  double latitude = 3;
  double longitude = 4;
  optional double speed = 5;
  string timestamp = 6;
}

message LocationListReply {
  repeated LocationReply locations = 1;
}
