syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Alert";

package alert;

service AlertGrpc {
  rpc GetByVehicle (VehicleIdRequest) returns (AlertListReply);
}

message VehicleIdRequest {
  string vehicle_id = 1;
}

message AlertReply {
  string id = 1;
  string vehicle_id = 2;
  string type = 3;
  string message = 4;
  bool is_resolved = 5;
  string created_at = 6;
}

message AlertListReply {
  repeated AlertReply alerts = 1;
}
