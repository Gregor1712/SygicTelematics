syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Vehicle";

package vehicle;

service VehicleGrpc {
  rpc GetById (VehicleIdRequest) returns (VehicleReply);
  rpc GetAll (GetVehiclesRequest) returns (VehicleListReply);
}

message VehicleIdRequest {
  string vehicle_id = 1;
}

message GetVehiclesRequest {
  optional string vin = 1;
  optional string model = 2;
  optional string manufacturer = 3;
  optional string sort_by = 4;
  optional string sort_direction = 5;
  int32 page_number = 6;
  int32 page_size = 7;
}

message VehicleReply {
  string id = 1;
  string vin = 2;
  string model = 3;
  string manufacturer = 4;
  int32 year = 5;
  optional string current_location_id = 6;
  optional string battery_status_id = 7;
  optional string last_trip_id = 8;
}

message VehicleListReply {
  repeated VehicleReply vehicles = 1;
  int32 page_number = 2;
  int32 page_size = 3;
  int32 total_records = 4;
}
