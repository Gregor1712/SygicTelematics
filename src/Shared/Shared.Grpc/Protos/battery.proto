syntax = "proto3";

option csharp_namespace = "Shared.Grpc.Battery";

package battery;

service BatteryGrpc {
  rpc GetByVehicle (VehicleIdRequest) returns (BatteryListReply);
  rpc Create (CreateBatteryRequest) returns (BatteryReply);
}

message VehicleIdRequest {
  string vehicle_id = 1;
}

message CreateBatteryRequest {
  string vehicle_id = 1;
  int32 percentage = 2;
  double voltage = 3;
  optional double temperature = 4;
  bool is_charging = 5;
}

message BatteryReply {
  string id = 1;
  string vehicle_id = 2;
  int32 percentage = 3;
  double voltage = 4;
  optional double temperature = 5;
  bool is_charging = 6;
  string timestamp = 7;
}

message BatteryListReply {
  repeated BatteryReply statuses = 1;
}
